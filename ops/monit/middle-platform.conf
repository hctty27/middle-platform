# Include this file from the Monit configuration directory.
# The main monitrc should use: set daemon 10

check program middle-platform-config-center-live with path "/data/middle-platform/ops/monit/check-http-live.sh config-center 8201"
    with timeout 5 seconds
    if status != 0 for 3 cycles then exec "/usr/bin/supervisorctl restart config-center"

check program middle-platform-sdk-core-1-live with path "/data/middle-platform/ops/monit/check-http-live.sh sdk-core-1 8211"
    with timeout 5 seconds
    if status != 0 for 3 cycles then exec "/usr/bin/supervisorctl restart sdk-core-1"

check program middle-platform-sdk-core-2-live with path "/data/middle-platform/ops/monit/check-http-live.sh sdk-core-2 8212"
    with timeout 5 seconds
    if status != 0 for 3 cycles then exec "/usr/bin/supervisorctl restart sdk-core-2"

check program middle-platform-sdk-service-live with path "/data/middle-platform/ops/monit/check-http-live.sh sdk-service 8221"
    with timeout 5 seconds
    if status != 0 for 3 cycles then exec "/usr/bin/supervisorctl restart sdk-service"

# Optional: uncomment only when config-center-access is installed and supervised.
# check program middle-platform-config-center-access-live with path "/data/middle-platform/ops/monit/check-http-live.sh config-center-access 8291"
#     with timeout 5 seconds
