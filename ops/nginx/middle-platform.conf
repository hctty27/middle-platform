# ============================================================
# 研发中台 Nginx 站点配置
# 域名：mp.skybluek.com
# 实例规模：config-center 2 / sdk-core 2 / sdk-service 4 / sdk-admin 1
#
# 安装位置：/etc/nginx/conf.d/middle-platform.conf
# 动态 upstream 实例状态由 upstream-control.sh 维护。
# ============================================================


# Nginx access logs use the process timezone and an explicit ISO-8601 offset.
log_format middle_platform '$remote_addr - $remote_user [$time_iso8601] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';


# ============================================================
# 1. Upstream
# ============================================================

upstream config_center {
    least_conn;
    include /data/middle-platform/run/nginx/config-center-upstream.conf;
    keepalive 16;
}

upstream sdk_core {
    least_conn;
    include /data/middle-platform/run/nginx/sdk-core-upstream.conf;
    keepalive 64;
}

upstream sdk_service {
    least_conn;
    include /data/middle-platform/run/nginx/sdk-service-upstream.conf;
    keepalive 64;
}

upstream sdk_admin {
    include /data/middle-platform/run/nginx/sdk-admin-upstream.conf;
    keepalive 8;
}

# ============================================================
# 2. HTTP -> HTTPS
# ============================================================

server {
    listen 80 backlog=8192;
    server_name mp.skybluek.com;

    access_log /data/log/nginx/mp.skybluek.com.log middle_platform;

    return 301 https://mp.skybluek.com$request_uri;
}


# ============================================================
# 3. HTTPS
# ============================================================

server {
    # 有效队列取本值与内核 net.core.somaxconn 的较小者，默认 somaxconn=128 会截断突发建连；
    # 内核参数见 ops/sysctl.d/99-listen-backlog.conf。修改后必须重启 Nginx，
    # reload 不会重建已经监听的套接字。
    listen 443 ssl backlog=8192;
    server_name mp.skybluek.com;

    ssl_certificate /etc/nginx/ssl/1_skybluek.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/2_skybluek.com.key;

    access_log /data/log/nginx/mp.skybluek.com.log middle_platform buffer=64k flush=1s;
    error_log /data/log/nginx/mp.skybluek.com.error.log warn;

    # 公共代理配置
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 2s;
    proxy_send_timeout 35s;
    proxy_read_timeout 65s;
    proxy_request_buffering on;

    # 不启用 non_idempotent，避免重放已发送的订单/支付 POST 请求。
    # HTTP 503 不作为 upstream 故障摘除条件，避免共享 MySQL 故障导致实例集体摘除。
    proxy_next_upstream error timeout invalid_header http_502 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;


    # Config Center API
    location ^~ /api/config/ {
        proxy_pass http://config_center;
    }

    # SDK Core API
    location ^~ /api/core/ {
        proxy_pass http://sdk_core;
    }

    # SDK Service API
    location ^~ /api/service/ {
        proxy_pass http://sdk_service;
    }


    # 独立 SDK 管理 API；不添加 URI 后缀，保持 HMAC 签名所绑定的原始请求路径。
    location ^~ /api/sdk/admin/ {
        proxy_pass http://sdk_admin;
    }

    # 管理后台入口
    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Vue SPA
    location ^~ /admin/ {
        root /data/middle-platform;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
}
