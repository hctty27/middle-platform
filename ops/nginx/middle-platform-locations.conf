# Merge these locations into the existing server {} block.
location ^~ /api/config/ {
    proxy_pass http://config_center;
    include /data/middle-platform/ops/nginx/proxy-common.conf;
}

location ^~ /api/core/ {
    proxy_pass http://sdk_core;
    include /data/middle-platform/ops/nginx/proxy-common.conf;
}

location ^~ /api/service/ {
    proxy_pass http://sdk_service;
    include /data/middle-platform/ops/nginx/proxy-common.conf;
}
