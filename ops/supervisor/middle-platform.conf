; 生产 Supervisor 模板。使用前核对用户、路径、配置和端口。
; 若服务器已存在同名 program，请合并配置，不要重复定义。
; 低 priority 先启动、后停止。

[program:config-center]
command=/data/middle-platform/bin/config-center -config /data/middle-platform/config/config-center.yaml
directory=/data/middle-platform
user=middle-platform
umask=027
priority=100
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=20
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
redirect_stderr=true
stdout_logfile=/data/middle-platform/logs/config-center.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=CONFIG_GO_ADDR="127.0.0.1:8201"

; 可选：只有实际部署本地配置副本时才启用。
; [program:config-center-access]
; command=/data/middle-platform/bin/config-center-access -config /data/middle-platform/config/config-center-access.yaml
; directory=/data/middle-platform
; user=middle-platform
; umask=027
; priority=200
; autostart=true
; autorestart=unexpected
; exitcodes=0
; startsecs=30
; startretries=20
; stopsignal=TERM
; stopwaitsecs=60
; stopasgroup=true
; redirect_stderr=true
; stdout_logfile=/data/middle-platform/logs/config-center-access.log
; stdout_logfile_maxbytes=50MB
; stdout_logfile_backups=5
; environment=CONFIG_ACCESS_ADDR="127.0.0.1:8291"

