[program:config-center-1]
command=/data/middle-platform/bin/config-center -config /data/middle-platform/config/config-center.yaml
directory=/data/middle-platform
user=middle-platform
umask=027
priority=100
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=20
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
redirect_stderr=true
stdout_logfile=/data/middle-platform/logs/config-center-1.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=CONFIG_GO_ADDR="127.0.0.1:8201"

