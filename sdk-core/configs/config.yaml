# SDK Core 公共配置模板，密钥只写入服务器本地配置，不能提交仓库。
server:
  address: ":8082"

# config_center 权威库，只读
database:
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 订单独立库；留空时不启用订单和回调接口
orderDatabase:
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 游戏服登记签名 HMAC-SHA256，凭据绑定 AppID 与环境
gameAuth:
  keys: {}

# 真实平台 v1 的 SHA-1 密钥；签名不覆盖金额
# 正式环境始终拒绝根据 v1 直接确认支付
payment:
  secrets: {}
  allowUnverifiedNonProd: false

# SDK Core 向游戏发货使用独立 HMAC；域名严格准入
gameNotify:
  allowedHosts: []
  secrets: {}

log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
