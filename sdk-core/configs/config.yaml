# SDK Core 公共配置模板，密钥只写入服务器本地配置，不能提交仓库。
server:
  address: ":8082"

# config_center 权威库：同一个连接池供配置查询和订单读写共享。
# 账号仅需配置表 SELECT 与 game_order 表 SELECT/INSERT/UPDATE，不授予全库写权限。
database:
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 订单登记、支付回调路由和发货补偿 Worker 默认随服务启动。
# 依赖 config-center 统一 V12 schema，不需要额外的 order.enabled 开关。

# 游戏通信主密钥只保存在配置中心 game.config.gameSecret 中（Base64 编码的 32 随机字节）。
# SDK Core 与游戏服对两个用途分别派生 HKDF 密钥；这里不再配置 gameAuth.keys。

# 平台 appSecret 从 config_channel_app.config 读取。
# 平台 v1 不签金额，所有环境均不会凭该回调确认支付或发货；需接入可信查单。
# SDK Core 向游戏发货：使用 gameSecret 派生的通知密钥；只配置允许的 HTTPS 域名。
gameNotify:
  allowedHosts: []

log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
