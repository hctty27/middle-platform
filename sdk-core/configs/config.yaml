# SDK Core：使用 config_center 同一连接池读取配置、更新订单。
server:
  address: ":8082"

# 配置表只读、game_order 表读写；订单表须提前手动建好。
database:
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 平台密钥来自 channel_app.config.appSecret，游戏密钥来自 game.config.gameSecret。
# 平台 v1 未签名金额字段；SDK Core 不做二次查单，仅校验回调与登记金额一致。
gameNotify:
  allowedHosts: [] # 允许的 HTTPS 游戏回调域名

log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
