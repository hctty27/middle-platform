# SDK Core 公共配置模板，密钥只写入服务器本地配置，不能提交仓库。
server:
  address: ":8082"

# config_center 权威库：读取游戏与渠道包配置，使用只读账号
database:
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 与 database.dsn 指向同一 MySQL 实例、同一 config_center 库，但建议使用仅可读写 game_order 的独立账号。
# 留空时订单和支付回调接口不注册；建表仅由 config-center/cmd/migrate 的 V12 执行。
orderDatabase:
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 游戏通信主密钥只保存在配置中心 game.config.gameSecret 中（Base64 编码的 32 随机字节）。
# SDK Core 与游戏服对两个用途分别派生 HKDF 密钥；这里不再配置 gameAuth.keys。

# 平台密钥从 config_channel_app.config.appSecret（渠道包 JSON 顶层）读取，跨环境共享。
# 不在此处重复配置 payment.secrets；平台 v1 未签金额，正式环境拒绝确认支付。
payment:
  allowUnverifiedNonProd: false

# SDK Core 向游戏发货：使用 gameSecret 派生的通知密钥；只配置允许的 HTTPS 域名。
gameNotify:
  allowedHosts: []

log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
