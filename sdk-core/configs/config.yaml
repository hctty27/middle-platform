# SDK Core：使用 config_center 同一连接池读取配置、更新订单。
server:
  address: ":8082"

# 配置表只读、game_order 表读写；订单表须提前手动建好。
database:
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 管理接口单独验签；与配置中心填写同一密钥。默认开启验签且密钥不能为空；仅在可信开发环境设置 enabled: false 可以免签。
adminAuth:
  enabled: true
  secret: ""

# 平台密钥来自 sdk_channel_app.config.appSecret，游戏密钥来自 sdk_node_config 中游戏节点的 gameSecret。
# 平台 v1 未签名金额字段；SDK Core 不做二次查单，仅校验回调与登记金额一致。
log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
