# SDK Core 公共配置模板，密钥只写入服务器本地配置，不能提交仓库。
server:
  address: ":8082"

# config_center 权威库：同一个连接池供配置查询和订单读写共享。
# 账号仅需配置表 SELECT 与 game_order 表 SELECT/INSERT/UPDATE，不授予全库写权限。
database:
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 默认关闭订单功能，不注册订单/支付回调路由，也不启动通知补偿 Worker。
# 启用前必须先由 config-center/cmd/migrate 执行 V12，完成联调与支付安全评审。
order:
  enabled: false

# 游戏通信主密钥只保存在配置中心 game.config.gameSecret 中（Base64 编码的 32 随机字节）。
# SDK Core 与游戏服对两个用途分别派生 HKDF 密钥；这里不再配置 gameAuth.keys。

# 平台密钥从 config_channel_app.config.appSecret（渠道包 JSON 顶层）读取，跨环境共享。
# 不在此处重复配置 payment.secrets；平台 v1 未签金额，正式环境拒绝确认支付。
payment:
  allowUnverifiedNonProd: false

# SDK Core 向游戏发货：使用 gameSecret 派生的通知密钥；只配置允许的 HTTPS 域名。
gameNotify:
  allowedHosts: []

log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
