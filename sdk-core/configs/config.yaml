# SDK 核心服务公共模板；复制为 config-dev.yaml 后填写数据库连接信息。
# 本服务只读取 config-center 权威库，不建立本地副本，也不执行数据库迁移。
server:
  # SDK_CORE_ADDR；生产建议通过 Nginx 代理 /api/core/
  address: ":8082"

database:
  # SDK_CORE_DB_DSN；与 config-center 指向同一个 config_center 数据库，使用只读账号。
  # 示例：sdk_reader:password@tcp(127.0.0.1:3306)/config_center?parseTime=true&loc=UTC
  dsn: ""
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "30m"

# 统一日志配置；默认交给 Docker / systemd 负责轮转。
log:
  level: info              # debug / info / warn / error；LOG_LEVEL
  format: json             # json / text；LOG_FORMAT
  output: stdout           # stdout / stderr；LOG_OUTPUT
  accessEnabled: true      # 正常访问日志开关；LOG_ACCESS_ENABLED
  slowThreshold: 500ms     # 慢请求阈值；LOG_SLOW_THRESHOLD
