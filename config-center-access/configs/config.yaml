# 配置接入端：使用独立的 config_access 副本库，不写权威库。
server:
  address: ":8081"

# 本地 MySQL 副本库；新空库先手动执行 db/full/config_access.sql。
database:
  dsn: ""

# 配置中心地址只填协议、主机和端口。
configCenter:
  url: "http://127.0.0.1:8080"

# 与配置中心订阅者设置的密钥一致，不能为空。
webhook:
  secret: ""

# 网络超时与定期全量校对周期；收到有效回调仍会立即同步。
sync:
  connectTimeout: "2s"
  requestTimeout: "15s"
  reconcileInterval: "5m"

log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
