# 配置接入端：复制为独立的 config-prod.yaml；使用 config_access 副本库。
database:
  dsn: ""

configCenter:
  url: "http://127.0.0.1:8080"

# 与配置中心 config_subscriber 对应记录一致，密钥必须唯一。
subscriber:
  code: ""
  secret: ""

# 同步超时和全量校对周期使用代码默认值：2s、15s、5m。

# 日志固定 JSON/stdout、慢请求阈值 500ms；可调整日志级别和正常请求日志开关。
log:
  level: info
  accessEnabled: true
