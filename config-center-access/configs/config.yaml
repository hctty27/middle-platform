# ============================================================
# 配置接入服务（config-center-access）通用配置模板
# ============================================================
# 用法：
# 1. 复制为 configs/config-dev.yaml（本地）或 configs/config-prod.yaml（生产）。
# 2. 填写独立副本数据库及 Webhook 密钥；两个值不能为空。
# 3. 启动：go run ./cmd/config-center-access -config configs/config-dev.yaml
#
# 配置优先级：程序默认值 < 同目录 config.yaml < 指定的环境 YAML < 环境变量。
# config-dev.yaml / config-prod.yaml 已被 .gitignore 忽略，不要提交真实密码或密钥。
# 本接入服务使用自己的 MySQL 副本库，不直接写配置中心的权威数据库。

# 接入服务的 HTTP 接口
server:
  # 服务监听地址，默认 8081。
  # ":8081" 监听所有网络接口；仅本机联调可改为 "127.0.0.1:8081"。
  # 提供 /health/ready、/api/access/nodes、/api/access/revision；
  # 回调地址是 POST /internal/config/callback，不应直接暴露公网。
  # 对应环境变量：CONFIG_ACCESS_ADDR
  address: ":8081"

# 接入方本地 MySQL 数据库（与配置中心分开）
database:
  # Go MySQL DSN，不能使用配置中心的 config_center 数据库。
  # 格式示例：root:你的密码@tcp(127.0.0.1:3306)/config_access?parseTime=true&loc=UTC
  # 新建空库时接入进程会自动初始化副本表。
  # 已存在旧版副本库时，请先备份并根据 README 执行对应 SQL 迁移。
  # 空字符串仅用于模板，启动前必须设置。
  # 对应环境变量：ACCESS_DB_DSN
  dsn: ""

# 配置中心的 HTTP 地址
configCenter:
  # 只填写协议、主机和端口，不要带 /api/config 等接口路径。
  # 这里指向同一台电脑上运行的 config-center（8080）。
  # 分机器部署时改成配置中心的实际内网地址或 HTTPS 域名。
  # 对应环境变量：CONFIG_CENTER_URL
  url: "http://127.0.0.1:8080"

# 接收配置中心的签名回调
webhook:
  # HMAC-SHA256 签名密钥：必须与配置中心注册的订阅者 secret 完全一致。
  # 请设置足够长且不可预测的随机字符串，不能留空。
  # 回调经过验签后只触发配置同步，不直接携带配置内容。
  # 不要将生产密钥提交到仓库，生产建议通过环境变量注入。
  # 对应环境变量：CONFIG_WEBHOOK_SECRET
  secret: ""

# 配置同步与容错参数
sync:
  # 连接配置中心时建立 TCP/TLS 连接的超时时间。
  # 使用 Go Duration 字符串，如 "500ms"、"2s"；范围 1ms～120s。
  # 对应环境变量：CONFIG_CLIENT_CONNECT_TIMEOUT_MS（单位：毫秒）
  connectTimeout: "2s"

  # 从配置中心发起一次 HTTP 请求的整体超时时间。
  # 网络较慢时可调大，但不要无限增大；范围 1ms～120s。
  # 对应环境变量：CONFIG_CLIENT_READ_TIMEOUT_MS（单位：毫秒）
  requestTimeout: "15s"

  # 定时主动校对远端 revision 的间隔，避免丢失 Webhook 后长期不同步。
  # 支持 "30s"、"5m" 等 Go Duration 字符串，最小 1s。
  # 接收到有效回调时仍会主动触发同步，不必等待这个周期。
  # 对应环境变量：CONFIG_RECONCILE_INTERVAL（如 "5m"）
  reconcileInterval: "5m"

# 统一日志配置；默认交给 Docker / systemd 负责轮转。
log:
  level: info              # debug / info / warn / error；LOG_LEVEL
  format: json             # json / text；LOG_FORMAT
  output: stdout           # stdout / stderr；LOG_OUTPUT
  accessEnabled: true      # 正常访问日志开关；LOG_ACCESS_ENABLED
  slowThreshold: 500ms     # 慢请求阈值；LOG_SLOW_THRESHOLD
