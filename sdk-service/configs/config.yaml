# SDK Service：同库只读，游戏地址与适配器来自 sdk_node_config（SDK Core 管理）。
server:
  address: ":8221"

database:
  dsn: ""
  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifetime: "30m"

game:
  timeout: "5s"

# 游戏上报至平台的地址，未开启相应功能时可留空。
platform:
  eventReportURL: ""
  subscribeMessageURL: ""

log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
