# SDK Service：实例地址由 SDK_SERVICE_ADDR 覆盖，超时预算按 game.timeout 自动计算。
database:
  dsn: ""
  maxOpenConns: 10
  maxIdleConns: 5

game:
  timeout: 5s

# 默认缓存 5s；服务停用、验签密钥撤销和用户核验开关变更可能延迟生效。
# 如需实时读取，可设 ttl: 0s（此时绕过缓存合并与 maxInflight 限制）。
configCache:
  ttl: 5s
  maxEntries: 4096
  maxInflight: 8

# 未启用的平台业务可省略对应 URL。
platform:
  eventReportURL: ""
  subscribeMessageURL: ""
  userCheckURL: ""
  maxIdlePerHost: 32
  eventMaxConns: 0

log:
  level: info
  accessEnabled: false
