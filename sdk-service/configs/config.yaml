# SDK Service：实例地址由 SDK_SERVICE_ADDR 覆盖，超时预算按 game.timeout 自动计算。
database:
  dsn: ""
  maxOpenConns: 10

game:
  timeout: 5s

# 默认为实时查库；非零 TTL 会延迟配置/密钥撤销生效。
configCache:
  ttl: 0s

# 未启用的平台业务可省略对应 URL。
platform:
  eventReportURL: ""
  subscribeMessageURL: ""
  userCheckURL: ""

log:
  level: info
  accessEnabled: false
