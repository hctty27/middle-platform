name: LT26 read-only config QPS 1.1k-1.4k with runner metrics
on:
  push:
    branches:
      - test/lt26-config-qps-5000-20000-20261117

permissions: {}
concurrency:
  group: lt26-config-mid-qps-20261117
  cancel-in-progress: false

jobs:
  config-qps:
    if: ${{ github.repository == 'hctty27/middle-platform' && github.actor == 'hctty27' && github.ref == 'refs/heads/test/lt26-config-qps-5000-20000-20261117' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Run bounded read-only GET stages and monitor the load generator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne 'DESKTOP-HA11EIT') { throw 'Unexpected runner; refusing load.' }

          $base = 'https://mp.skybluek.com'
          $freeMB = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024
          Write-Host ('WINDOWS_PREFLIGHT free_memory_mb={0}' -f [math]::Round($freeMB))
          if ($freeMB -lt 4096) { throw 'Less than 4 GiB free memory on load generator; no load sent.' }

          $paths = New-Object System.Collections.Generic.List[string]
          $cmd = Get-Command k6 -ErrorAction SilentlyContinue
          if ($cmd -and $cmd.CommandType -eq 'Application') { $paths.Add($cmd.Source) }
          foreach ($folder in @(
            "$env:ProgramFiles/k6", "$env:ProgramFiles/Grafana Labs/k6",
            "$env:LOCALAPPDATA/Microsoft/WinGet/Links", "$env:LOCALAPPDATA/Microsoft/WinGet/Packages"
          )) {
            if (Test-Path -LiteralPath $folder -PathType Container) {
              Get-ChildItem -LiteralPath $folder -Recurse -File -Filter k6.exe -ErrorAction SilentlyContinue |
                ForEach-Object { $paths.Add($_.FullName) }
            }
          }
          foreach ($profile in @(Get-ChildItem -LiteralPath "$env:SystemDrive/Users" -Directory -ErrorAction SilentlyContinue)) {
            foreach ($suffix in @('AppData/Local/Microsoft/WinGet/Links','AppData/Local/Microsoft/WinGet/Packages')) {
              $folder = Join-Path $profile.FullName $suffix
              if (Test-Path -LiteralPath $folder -PathType Container) {
                Get-ChildItem -LiteralPath $folder -Recurse -File -Filter k6.exe -ErrorAction SilentlyContinue |
                  ForEach-Object { $paths.Add($_.FullName) }
              }
            }
          }
          $k6 = $null
          foreach ($exe in @($paths | Select-Object -Unique)) {
            if (Test-Path -LiteralPath $exe -PathType Leaf) {
              & $exe version
              if ($LASTEXITCODE -eq 0) { $k6 = $exe; break }
            }
          }
          if (-not $k6) { throw 'Installed k6 executable was not found.' }

          $probe = Invoke-WebRequest -Uri ($base + '/api/core/config/test/lt26-app-000') -Method Get -UseBasicParsing -TimeoutSec 20 -MaximumRedirection 0
          $probeBody = $probe.Content | ConvertFrom-Json
          if ($probe.StatusCode -ne 200 -or $probeBody.code -ne 0 -or $probeBody.data.snKey -cne 'lt26-app-000') {
            throw 'Read-only readiness probe failed; no load test was started.'
          }
          Write-Host 'READINESS_PASS: target verified; only SDK config GET requests will be sent.'

          $script = @'
          import http from 'k6/http';
          import exec from 'k6/execution';
          import { Rate } from 'k6/metrics';

          const base = __ENV.BASE_URL;
          const qps = Number(__ENV.QPS);
          const seconds = Number(__ENV.SECONDS);
          const appIds = Array.from({ length: 256 }, (_, i) => 'lt26-app-' + String(i).padStart(3, '0'));
          const businessFailed = new Rate('business_failed');

          if (base !== 'https://mp.skybluek.com' || ![1100, 1200, 1300, 1400].includes(qps) || seconds !== 20) {
            throw new Error('Refusing unapproved target or schedule');
          }

          export const options = {
            scenarios: {
              config_read: {
                executor: 'constant-arrival-rate',
                rate: qps,
                timeUnit: '1s',
                duration: seconds + 's',
                preAllocatedVUs: 900,
                maxVUs: 1500,
                gracefulStop: '5s',
              },
            },
            thresholds: {
              http_req_failed: [{ threshold: 'rate<0.000001', abortOnFail: true, delayAbortEval: '5s' }],
              business_failed: [{ threshold: 'rate<0.000001', abortOnFail: true, delayAbortEval: '5s' }],
              dropped_iterations: [{ threshold: 'count<1', abortOnFail: true, delayAbortEval: '5s' }],
              http_req_duration: [
                { threshold: 'p(95)<100', abortOnFail: true, delayAbortEval: '5s' },
                { threshold: 'p(99)<300', abortOnFail: true, delayAbortEval: '5s' },
              ],
              http_reqs: ['count>=' + Math.floor(qps * seconds * 0.99)],
            },
            maxRedirects: 0,
            summaryTrendStats: ['avg', 'med', 'max', 'p(95)', 'p(99)'],
          };

          export default function () {
            const appId = appIds[exec.scenario.iterationInTest % appIds.length];
            const res = http.get(base + '/api/core/config/test/' + appId, {
              timeout: '3s',
              tags: { name: 'sdk-config-read' },
            });
            let success = false;
            try {
              const body = res.json();
              success = res.status === 200 && body.code === 0 && body.data && body.data.snKey === appId;
            } catch (_) {}
            businessFailed.add(!success);
          }
          '@

          $work = Join-Path $env:RUNNER_TEMP ('lt26-config-low-qps-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, ('LOAD_DIR=' + $work + [Environment]::NewLine), $utf8)
          $scriptPath = Join-Path $work 'config-read.js'
          Set-Content -LiteralPath $scriptPath -Value $script -Encoding UTF8

          $monitorPath = Join-Path $work 'runner-metrics.csv'
          $monitor = Start-Job -ArgumentList $monitorPath -ScriptBlock {
            param($path)
            $ErrorActionPreference = 'SilentlyContinue'
            'utc,cpu_load_percent,free_memory_mb,k6_working_set_mb' | Set-Content -LiteralPath $path -Encoding UTF8
            while ($true) {
              $cpu = (Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average
              $free = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024
              $k6 = Get-Process -Name k6 -ErrorAction SilentlyContinue | Measure-Object -Property WorkingSet64 -Sum
              $workingSet = if ($k6.Sum) { [math]::Round($k6.Sum / 1MB) } else { 0 }
              Add-Content -LiteralPath $path -Value ('{0},{1},{2},{3}' -f [DateTime]::UtcNow.ToString('o'), $cpu, [math]::Round($free), $workingSet)
              Start-Sleep -Seconds 1
            }
          }

          $env:BASE_URL = $base
          $env:SECONDS = '20'
          try {
            foreach ($rate in @(1100, 1200, 1300, 1400)) {
              $freeMB = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024
              Write-Host ('PREFLIGHT target={0} QPS free_memory_mb={1}' -f $rate, [math]::Round($freeMB))
              if ($freeMB -lt 4096) { throw 'Load generator free memory fell below 4 GiB; stopped.' }

              $env:QPS = [string]$rate
              $summary = Join-Path $work ('summary-' + $rate + '.json')
              Write-Host ('START target={0} QPS duration=20s channels=256 GET-only preAllocatedVUs=900 maxVUs=1500' -f $rate)
              & $k6 run --summary-export $summary $scriptPath
              $exitCode = $LASTEXITCODE
              if ($exitCode -ne 0) {
                Write-Host ('STOP target={0} QPS k6_exit={1}; no higher stage.' -f $rate, $exitCode)
                exit $exitCode
              }
              if (-not (Test-Path -LiteralPath $summary -PathType Leaf)) {
                throw ('Missing k6 summary for {0} QPS.' -f $rate)
              }
              Write-Host ('PASS stage={0} QPS: request count, latency, zero errors and zero drops passed.' -f $rate)
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('- PASS **' + $rate + ' QPS** — 20 seconds, 256 channels, GET-only')
              Start-Sleep -Seconds 5
            }
            Write-Host 'PASS all stages 1100/1200/1300/1400 QPS.'
          } finally {
            if ($monitor) {
              Stop-Job $monitor -ErrorAction SilentlyContinue
              Receive-Job $monitor -ErrorAction SilentlyContinue | Out-Null
              Remove-Job $monitor -Force -ErrorAction SilentlyContinue
            }
            Remove-Item Env:BASE_URL -ErrorAction SilentlyContinue
            Remove-Item Env:QPS -ErrorAction SilentlyContinue
            Remove-Item Env:SECONDS -ErrorAction SilentlyContinue
          }

      - name: Upload k6 summaries and runner metrics
        if: always() && env.LOAD_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: lt26-config-low-qps-${{ github.run_id }}
          path: ${{ env.LOAD_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: Clean temporary test files
        if: always()
        shell: powershell
        run: |
          if ($env:LOAD_DIR -and (Test-Path -LiteralPath $env:LOAD_DIR)) {
            Remove-Item -LiteralPath $env:LOAD_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }
