name: One-shot LT26 256-channel read-only verification
on:
  push:
    branches: [test/lt26-256-readonly-20261117]
permissions: {}
jobs:
  verify:
    if: github.repository == 'hctty27/middle-platform' && github.actor == 'hctty27' && github.ref == 'refs/heads/test/lt26-256-readonly-20261117'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Verify all 256 channel configs at 5 read-only requests per second
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne 'DESKTOP-HA11EIT') { throw 'Unexpected runner; refusing requests.' }
          $ok = 0
          $bad = New-Object System.Collections.Generic.List[string]
          $times = New-Object System.Collections.Generic.List[double]
          for ($i = 0; $i -lt 256; $i++) {
            $app = 'lt26-app-{0:D3}' -f $i
            $url = 'https://mp.skybluek.com/api/core/config/test/' + $app
            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            try {
              $response = Invoke-WebRequest -Uri $url -Method Get -UseBasicParsing -TimeoutSec 10 -MaximumRedirection 0
              $body = $response.Content | ConvertFrom-Json
              $watch.Stop()
              $times.Add($watch.Elapsed.TotalMilliseconds)
              if ($response.StatusCode -eq 200 -and $body.code -eq 0 -and $body.data.snKey -ceq $app) {
                $ok++
              } else {
                $bad.Add(('{0}:HTTP{1}:code{2}' -f $app,$response.StatusCode,$body.code))
              }
            } catch {
              $watch.Stop()
              $status = 'ERR'
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
              $bad.Add(('{0}:HTTP{1}' -f $app,$status))
            }
            if ($i -lt 255) { Start-Sleep -Milliseconds 200 }
          }
          $avg = 0
          $max = 0
          if ($times.Count -gt 0) {
            $avg = [math]::Round(($times | Measure-Object -Average).Average,2)
            $max = [math]::Round(($times | Measure-Object -Maximum).Maximum,2)
          }
          Write-Host ('RESULT total=256 passed={0} failed={1} avg_ms={2} max_ms={3} rate=5rps' -f $ok,$bad.Count,$avg,$max)
          if ($bad.Count -gt 0) {
            Write-Host ('FAILED_CHANNELS ' + ($bad -join ','))
            exit 1
          }
          Write-Host 'PASS: all 256 test channel configurations are readable. No writes or load test.'
