name: sdk-service

on:
  push:
    branches: [main]
    paths:
      - 'sdk-service/**'
      - 'shared/signature/**'
      - '.github/workflows/sdk-service.yml'
  pull_request:
    paths:
      - 'sdk-service/**'
      - 'shared/signature/**'
      - 'config-center/db/sql/**'
      - '.github/workflows/sdk-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: sdk-service/go.sum
      - name: Verify shared signature module
        working-directory: shared/signature
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Verify SDK Service module
        working-directory: sdk-service
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          go build -buildvcs=false ./cmd/sdk-service
