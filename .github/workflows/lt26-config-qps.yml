name: One-shot LT26 config QPS test
on:
  push:
    branches: [test/lt26-config-qps-20261117]
permissions: {}
concurrency:
  group: lt26-config-qps-20261117
  cancel-in-progress: false
jobs:
  config-qps:
    if: github.repository == 'hctty27/middle-platform' && github.actor == 'hctty27' && github.ref == 'refs/heads/test/lt26-config-qps-20261117'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Run bounded read-only SDK config load test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne 'DESKTOP-HA11EIT') { throw 'Unexpected runner; refusing execution.' }
          $base = 'https://mp.skybluek.com'
          $paths = New-Object System.Collections.Generic.List[string]
          $cmd = Get-Command k6 -ErrorAction SilentlyContinue
          if ($cmd -and $cmd.CommandType -eq 'Application') { $paths.Add($cmd.Source) }
          foreach ($folder in @(
            "$env:ProgramFiles/k6", "$env:ProgramFiles/Grafana Labs/k6",
            "$env:LOCALAPPDATA/Microsoft/WinGet/Links", "$env:LOCALAPPDATA/Microsoft/WinGet/Packages"
          )) {
            if (Test-Path -LiteralPath $folder -PathType Container) {
              Get-ChildItem -LiteralPath $folder -Recurse -File -Filter k6.exe -ErrorAction SilentlyContinue |
                ForEach-Object { $paths.Add($_.FullName) }
            }
          }
          foreach ($profile in @(Get-ChildItem -LiteralPath "$env:SystemDrive/Users" -Directory -ErrorAction SilentlyContinue)) {
            foreach ($suffix in @('AppData/Local/Microsoft/WinGet/Links','AppData/Local/Microsoft/WinGet/Packages')) {
              $folder = Join-Path $profile.FullName $suffix
              if (Test-Path -LiteralPath $folder -PathType Container) {
                Get-ChildItem -LiteralPath $folder -Recurse -File -Filter k6.exe -ErrorAction SilentlyContinue |
                  ForEach-Object { $paths.Add($_.FullName) }
              }
            }
          }
          $k6 = $null
          foreach ($exe in @($paths | Select-Object -Unique)) {
            if (Test-Path -LiteralPath $exe -PathType Leaf) {
              & $exe version
              if ($LASTEXITCODE -eq 0) { $k6 = $exe; break }
            }
          }
          if (-not $k6) { throw 'k6.exe not available to this runner.' }

          $probe = Invoke-WebRequest -Uri ($base + '/api/core/config/test/lt26-app-000') -Method Get -UseBasicParsing -TimeoutSec 10 -MaximumRedirection 0
          $probeBody = $probe.Content | ConvertFrom-Json
          if ($probe.StatusCode -ne 200 -or $probeBody.code -ne 0 -or $probeBody.data.snKey -cne 'lt26-app-000') {
            throw 'Read-only preflight failed; no load test was started.'
          }
          Write-Host 'Preflight passed. Target is mp.skybluek.com; SDK config GET only.'

          $script = @'
          import http from 'k6/http';
          import exec from 'k6/execution';
          import { Rate } from 'k6/metrics';

          const base = __ENV.BASE_URL;
          const qps = Number(__ENV.QPS);
          const seconds = Number(__ENV.SECONDS);
          const appIds = Array.from({ length: 256 }, (_, i) => 'lt26-app-' + String(i).padStart(3, '0'));
          const businessFailed = new Rate('business_failed');

          export const options = {
            scenarios: {
              config_read: {
                executor: 'constant-arrival-rate',
                rate: qps,
                timeUnit: '1s',
                duration: seconds + 's',
                preAllocatedVUs: Math.max(30, Math.ceil(qps * 0.25)),
                maxVUs: Math.max(100, Math.ceil(qps * 1.25)),
                gracefulStop: '5s',
              },
            },
            thresholds: {
              http_req_failed: ['rate<0.01'],
              business_failed: ['rate<0.01'],
              http_req_duration: ['p(95)<500', 'p(99)<1500'],
              dropped_iterations: ['count<1'],
              http_reqs: ['count>=' + Math.floor(qps * seconds * 0.999)],
            },
            summaryTrendStats: ['avg', 'med', 'max', 'p(90)', 'p(95)', 'p(99)'],
            maxRedirects: 0,
          };

          export default function () {
            const appId = appIds[exec.scenario.iterationInTest % appIds.length];
            const res = http.get(base + '/api/core/config/test/' + appId, {
              timeout: '5s',
              tags: { name: 'sdk-config-read' },
            });
            let success = false;
            try {
              const body = res.json();
              success = res.status === 200 && body.code === 0 && body.data && body.data.snKey === appId;
            } catch (_) {}
            businessFailed.add(!success);
          }
          '@

          $work = Join-Path $env:TEMP ('lt26-config-qps-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $scriptPath = Join-Path $work 'config-read.js'
          Set-Content -LiteralPath $scriptPath -Value $script -Encoding UTF8
          $env:BASE_URL = $base
          $env:SECONDS = '20'
          try {
            foreach ($rate in @(50,100,200,400)) {
              $env:QPS = [string]$rate
              $summary = Join-Path $work ('summary-' + $rate + '.json')
              Write-Host ("START stage target={0} QPS duration=20s channels=256" -f $rate)
              & $k6 run --summary-export $summary $scriptPath
              $exitCode = $LASTEXITCODE
              if ($exitCode -ne 0) {
                Write-Host ("STOP stage target={0} QPS k6_exit={1}; no higher stage will run." -f $rate,$exitCode)
                exit $exitCode
              }
              if (-not (Test-Path -LiteralPath $summary -PathType Leaf)) {
                throw ("Missing k6 summary for {0} QPS; stopping." -f $rate)
              }
              $data = Get-Content -LiteralPath $summary -Raw | ConvertFrom-Json
              $lat = $data.metrics.http_req_duration.values
              $http = $data.metrics.http_reqs.values
              $httpFailed = $data.metrics.http_req_failed.values.rate
              $business = $data.metrics.business_failed.values.rate
              $dropped = $data.metrics.dropped_iterations.values.count
              $count = $http.count
              $p95 = $lat.'p(95)'
              $p99 = $lat.'p(99)'
              $avg = $lat.avg
              Write-Host ("RESULT target={0} actual_avg_rps={1} requests={2} avg_ms={3} p95_ms={4} p99_ms={5} http_error_rate={6} business_error_rate={7} dropped={8}" -f $rate,[math]::Round($http.rate,2),$count,[math]::Round($avg,2),[math]::Round($p95,2),[math]::Round($p99,2),[math]::Round($httpFailed,5),[math]::Round($business,5),$dropped)
              if ($count -lt [math]::Floor($rate * 20 * 0.999) -or $dropped -gt 0 -or $httpFailed -ge 0.01 -or $business -ge 0.01 -or $p95 -ge 500 -or $p99 -ge 1500) {
                throw ("Acceptance check failed at {0} QPS; stopped further escalation." -f $rate)
              }
              Write-Host ("PASS stage={0} QPS" -f $rate)
              Start-Sleep -Seconds 5
            }
            Write-Host 'PASS all stages: 50/100/200/400 QPS; GET-only; 256 channels; no write APIs.'
          } finally {
            Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item Env:BASE_URL -ErrorAction SilentlyContinue
            Remove-Item Env:QPS -ErrorAction SilentlyContinue
            Remove-Item Env:SECONDS -ErrorAction SilentlyContinue
          }
