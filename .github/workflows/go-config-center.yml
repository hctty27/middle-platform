name: Go config center

on:
  push:
    paths:
      - "config-center-go/**"
      - "scripts/ci_go_compat.py"
      - "scripts/ci_go_benchmark.py"
      - ".github/workflows/go-config-center.yml"
  pull_request:
    paths:
      - "config-center-go/**"
      - "scripts/ci_go_compat.py"
      - "scripts/ci_go_benchmark.py"
      - ".github/workflows/go-config-center.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test-only
          MYSQL_DATABASE: config_center_go_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pintegration-test-only"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=20
    defaults:
      run:
        working-directory: config-center-go
    env:
      TEST_CONFIG_DB_DSN: "root:integration-test-only@tcp(127.0.0.1:3306)/config_center_go_test?parseTime=true&loc=UTC"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center-go/go.mod
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check sqlc 1.31.1 MySQL generation
        run: |
          curl -fsSL --retry 3 -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sqlc.tar.gz -C /tmp sqlc
          /tmp/sqlc generate
          test -z "$(git status --porcelain -- internal/sqlcgen)"
      - run: gofmt -w ./cmd/config-center/*.go ./internal/config/*.go
      - run: go test -count=1 -race ./...
      - run: go vet ./...
      - run: go build ./cmd/config-center

  compatibility:
    name: Real Flyway V1-V4 and Java/Go contract comparison
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test
          MYSQL_DATABASE: config_center_go_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
    env:
      CONFIG_DB_USER: root
      CONFIG_DB_PASSWORD: integration-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center-go/go.mod
      - name: Build Java and Go binaries
        run: |
          ./gradlew :config-center:bootJar --no-daemon
          cd config-center-go
          go mod tidy
          go build -o /tmp/config-center-go-ci ./cmd/config-center
      - name: Run existing real Flyway V1-V4 migration
        run: python3 scripts/ci_migration_smoke.py
      - name: Compare Java and Go API/transaction contracts
        run: python3 scripts/ci_go_compat.py
      - name: Collect informational performance baseline
        run: python3 scripts/ci_go_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-go-performance-baseline
          path: /tmp/config-go-benchmark.json
          if-no-files-found: ignore
