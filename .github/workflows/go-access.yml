name: Go access

on:
  push:
    paths:
      - 'config-center-access/**'
      - '.github/workflows/go-access.yml'
  pull_request:
    paths:
      - 'config-center-access/**'
      - '.github/workflows/go-access.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: config-center-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: config-center-access/go.mod
      - name: Check dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/config-center-access
