name: Package Supervisor Linux

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/package-supervisor.ps1'
      - 'scripts/package-supervisor-archive.go'
      - 'docs/supervisor-package.md'
      - '.github/workflows/package-supervisor.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/package-supervisor.ps1'
      - 'scripts/package-supervisor-archive.go'
      - '.github/workflows/package-supervisor.yml'

permissions:
  contents: read

jobs:
  # 本地和 CI 共用同一份 PowerShell 打包逻辑，避免产物结构不一致。
  package-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: config-center-admin/package-lock.json
      - name: Build binary and frontend release package
        shell: pwsh
        run: ./scripts/package-supervisor.ps1 -Arch amd64 -Version ${{ github.sha }}
      # 归档目录只允许 bin/ 与 admin/，并校验 ELF 架构和 Linux 执行位。
      - name: Verify Linux executable archive
        shell: bash
        run: |
          set -euo pipefail
          tarball="dist/middle-platform-${GITHUB_SHA}-linux-amd64.tar.gz"
          test -s "$tarball"
          entries="$(tar -tzf "$tarball")"
          for item in bin/ bin/config-center bin/config-center-access bin/sdk-core bin/migrate admin/ admin/index.html; do
            grep -Fx "$item" <<< "$entries"
          done
          while IFS= read -r item; do
            case "$item" in
              bin/|bin/config-center|bin/config-center-access|bin/sdk-core|bin/migrate|admin/|admin/*) ;;
              *) echo "Unexpected archive entry: $item" >&2; exit 1 ;;
            esac
          done <<< "$entries"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          tar -xzf "$tarball" -C "$tmpdir"
          for binary in config-center config-center-access sdk-core migrate; do
            test -x "$tmpdir/bin/$binary"
            test "$(stat -c %a "$tmpdir/bin/$binary")" = "755"
            file "$tmpdir/bin/$binary" | grep -E 'ELF 64-bit .*x86-64'
          done
          sha256sum "$tarball"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find dist -mindepth 1 -type d | wc -l)" -eq 0
      # 单文件直接下载 tar.gz，不再套一层 ZIP。
      - uses: actions/upload-artifact@v7
        with:
          name: middle-platform-supervisor-linux-amd64
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  # 验证 Windows 本地执行同一脚本，也能生成带 Unix 755 权限的 tar.gz。
  package-windows-amd64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center/go.sum
      - name: Build from Windows PowerShell
        shell: pwsh
        run: .\scripts\package-supervisor.ps1 -Arch amd64 -Version windows-test -SkipFrontend
      - name: Verify tar.gz on Windows
        shell: pwsh
        run: |
          $archive = 'dist/middle-platform-windows-test-linux-amd64.tar.gz'
          if (-not (Test-Path $archive)) { throw "Missing archive: $archive" }
          $names = @(& tar -tzf $archive)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read tar.gz' }
          foreach ($name in @('bin/config-center', 'bin/config-center-access', 'bin/sdk-core', 'bin/migrate')) {
            if ($name -notin $names) { throw "Missing binary: $name" }
          }
          if (@(Get-ChildItem dist -File).Count -ne 1) { throw 'Unexpected dist files' }
          if (@(Get-ChildItem dist -Directory).Count -ne 0) { throw 'Unexpected dist directories' }
          $details = @(& tar -tvzf $archive)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect tar permissions' }
          foreach ($name in @('config-center', 'config-center-access', 'sdk-core', 'migrate')) {
            if (-not ($details | Where-Object { $_ -match '^-rwxr-xr-x\s' -and $_.Trim().EndsWith("bin/$name") })) {
              throw "Missing executable permission in tar header: $name"
            }
          }
