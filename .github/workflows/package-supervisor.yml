name: Package Supervisor Linux

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/package-supervisor.ps1'
      - 'docs/supervisor-package.md'
      - '.github/workflows/package-supervisor.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/package-supervisor.ps1'
      - '.github/workflows/package-supervisor.yml'

permissions:
  contents: read

jobs:
  # 本地和 CI 共用同一份 PowerShell 打包逻辑，避免产物结构不一致。
  package-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: config-center-admin/package-lock.json
      - name: Build binary and frontend release package
        shell: pwsh
        run: ./scripts/package-supervisor.ps1 -Arch amd64 -Version ${{ github.sha }}
      # 上传前校验文件清单、Linux 架构及 SHA256 完整性。
      - name: Verify Linux package contents
        shell: bash
        run: |
          set -euo pipefail
          zipfile="dist/supervisor/middle-platform-${GITHUB_SHA}-linux-amd64.zip"
          test -s "$zipfile"
          for item in bin/config-center bin/config-center-access bin/sdk-core bin/migrate admin/index.html deploy/systemd/config-center.service deploy/systemd/sdk-core.service deploy/nginx/admin-static.conf SHA256SUMS.txt BUILD_INFO.txt; do
            unzip -Z -1 "$zipfile" | grep -Fx "$item"
          done
          tmpdir="$(mktemp -d)"
          unzip -q "$zipfile" -d "$tmpdir"
          (cd "$tmpdir" && sha256sum -c SHA256SUMS.txt)
          file "$tmpdir/bin/"*
      - uses: actions/upload-artifact@v4
        with:
          name: middle-platform-supervisor-linux-amd64
          path: dist/supervisor/*.zip
          if-no-files-found: error
          retention-days: 14
