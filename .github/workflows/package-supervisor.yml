name: Package Supervisor Linux

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/package-supervisor.ps1'
      - 'docs/supervisor-package.md'
      - '.github/workflows/package-supervisor.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/package-supervisor.ps1'
      - '.github/workflows/package-supervisor.yml'

permissions:
  contents: read

jobs:
  # 本地和 CI 共用同一份 PowerShell 打包逻辑，避免产物结构不一致。
  package-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: config-center-admin/package-lock.json
      - name: Build binary and frontend release package
        shell: pwsh
        run: ./scripts/package-supervisor.ps1 -Arch amd64 -Version ${{ github.sha }}
      # Linux tar.gz 保留 0755 执行位；上传前必须真实解压、校验架构及 SHA256。
      - name: Verify Linux executable archive
        shell: bash
        run: |
          set -euo pipefail
          tarball="dist/supervisor/middle-platform-${GITHUB_SHA}-linux-amd64.tar.gz"
          test -s "$tarball"
          for item in bin/config-center bin/config-center-access bin/sdk-core bin/migrate admin/index.html SHA256SUMS.txt BUILD_INFO.txt; do
            tar -tzf "$tarball" | grep -Fx "./$item"
          done
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          tar -xzf "$tarball" -C "$tmpdir"
          (cd "$tmpdir" && sha256sum -c SHA256SUMS.txt)
          for binary in config-center config-center-access sdk-core migrate; do
            test -x "$tmpdir/bin/$binary"
            test "$(stat -c %a "$tmpdir/bin/$binary")" = "755"
            file "$tmpdir/bin/$binary" | grep -E 'ELF 64-bit .*x86-64'
          done
      # Actions Artifact 外层下载为 ZIP，内层 tar.gz 的 Linux 权限不会丢失。
      - uses: actions/upload-artifact@v4
        with:
          name: middle-platform-supervisor-linux-amd64
          path: dist/supervisor/*.tar.gz
          if-no-files-found: error
          retention-days: 14
