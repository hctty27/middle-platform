name: Package Linux

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'config-center/**'
      - 'config-center-access/**'
      - 'sdk-core/**'
      - 'sdk-service/**'
      - 'shared/**'
      - 'admin/**'
      - 'publish/**'
      - 'scripts/package.ps1'
      - 'scripts/package-archive.go'
      - '.github/workflows/package.yml'
  push:
    branches: [main]
    paths:
      - 'config-center/**'
      - 'config-center-access/**'
      - 'sdk-core/**'
      - 'sdk-service/**'
      - 'shared/**'
      - 'admin/**'
      - 'publish/**'
      - 'scripts/package.ps1'
      - 'scripts/package-archive.go'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  # 本地和 CI 共用同一份 PowerShell 打包逻辑，避免产物结构不一致。
  package-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Build binary and frontend release package
        shell: pwsh
        run: ./scripts/package.ps1 -Arch amd64 -Version ${{ github.sha }}
      - name: Validate remote publish script syntax
        run: bash -n publish/publish-remote.sh
      - name: Publishing smoke tests
        run: python3 -I publish/ci_publish_smoke.py
      # 验证完整归档的内容、ELF 架构及 Linux 执行位。
      - name: Verify Linux executable archive
        shell: bash
        run: |
          set -euo pipefail
          tarball="dist/middle-platform-${GITHUB_SHA}-linux-amd64.tar.gz"
          test -s "$tarball"
          entries="$(tar -tzf "$tarball")"
          for item in bin/ bin/config-center bin/config-center-access bin/sdk-core bin/sdk-service sql/ sql/full/ sql/full/config_center.sql sql/full/config_access.sql sql/incremental/ admin/ admin/index.html admin/config.js admin/docs/ admin/docs/index.html admin/docs/guide.html; do
            grep -Fx "$item" <<< "$entries"
          done
          while IFS= read -r item; do
            case "$item" in
              bin/|bin/config-center|bin/config-center-access|bin/sdk-core|bin/sdk-service|sql/|sql/full/|sql/full/*|sql/incremental/|sql/incremental/*|admin/|admin/*) ;;
              *) echo "Unexpected archive entry: $item" >&2; exit 1 ;;
            esac
          done <<< "$entries"
          # 新增 SQL 自动校验归档完整性，避免遗漏增量文件。
          for path in db/full/*.sql db/incremental/*.sql; do
            test -f "$path"
            grep -Fx "sql/${path#db/}" <<< "$entries"
          done
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          tar -xzf "$tarball" -C "$tmpdir"
          for binary in config-center config-center-access sdk-core sdk-service; do
            test -x "$tmpdir/bin/$binary"
            test "$(stat -c %a "$tmpdir/bin/$binary")" = "755"
            file "$tmpdir/bin/$binary" | grep -E 'ELF 64-bit .*x86-64'
          done
          # 验证相对静态路径与运行时配置被真正写入发布包。
          grep -F 'config.js' "$tmpdir/admin/index.html"
          grep -F './assets/' "$tmpdir/admin/index.html"
          grep -F '__MIDDLE_PLATFORM_CONFIG__' "$tmpdir/admin/config.js"
          sha256sum "$tarball"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find dist -mindepth 1 -type d | wc -l)" -eq 0
      # 单文件直接下载 tar.gz，不再套一层 ZIP。
      - uses: actions/upload-artifact@v7
        with:
          name: middle-platform-linux-amd64
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  # 验证 Windows 本地执行同一脚本，也能生成带 Unix 755 权限的 tar.gz。
  package-windows-amd64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: '**/go.sum'
      - name: Build from Windows PowerShell
        shell: pwsh
        run: .\scripts\package.ps1 -Arch amd64 -Version windows-test -SkipFrontend
      - name: Publishing smoke tests on Windows
        shell: pwsh
        run: python -I publish/ci_publish_smoke.py
      - name: Verify tar.gz on Windows
        shell: pwsh
        run: |
          $archive = 'dist/middle-platform-windows-test-linux-amd64.tar.gz'
          if (-not (Test-Path $archive)) { throw "Missing archive: $archive" }
          $names = @(& tar -tzf $archive)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read tar.gz' }
          foreach ($name in @('bin/config-center', 'bin/config-center-access', 'bin/sdk-core', 'bin/sdk-service', 'sql/full/config_center.sql', 'sql/full/config_access.sql', 'sql/incremental/V0001__add_game_order.sql')) {
            if ($name -notin $names) { throw "Missing binary: $name" }
          }
          foreach ($sqlFile in @(Get-ChildItem -LiteralPath 'db/full', 'db/incremental' -File -Filter '*.sql')) {
            $sqlEntry = "sql/$($sqlFile.Directory.Name)/$($sqlFile.Name)"
            if ($sqlEntry -notin $names) { throw "Missing SQL: $sqlEntry" }
          }
          if (@(Get-ChildItem dist -File).Count -ne 1) { throw 'Unexpected dist files' }
          if (@(Get-ChildItem dist -Directory).Count -ne 0) { throw 'Unexpected dist directories' }
          $details = @(& tar -tvzf $archive)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect tar permissions' }
          foreach ($name in @('config-center', 'config-center-access', 'sdk-core', 'sdk-service')) {
            if (-not ($details | Where-Object { $_ -match '^-rwxr-xr-x\s' -and $_.Trim().EndsWith("bin/$name") })) {
              throw "Missing executable permission in tar header: $name"
            }
          }
