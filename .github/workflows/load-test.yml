name: Runner Load Test
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Load profile (all traffic stays on this runner)
        type: choice
        options: [smoke, baseline, stress, soak, soak2h, capacity]
        default: smoke
      topology:
        description: Instance topology
        type: choice
        options: [compact, cluster, both]
        default: compact
      scenario:
        description: Business scenario
        type: choice
        options: [all, config-sync, sdk-config, user-check, order, duplicate, payment, mixed]
        default: all
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/load-test.yml'
      - 'tests/load/**'

permissions:
  contents: read
concurrency:
  group: runner-load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    runs-on: ubuntu-24.04
    name: Load (${{ matrix.label }})
    timeout-minutes: ${{ matrix.profile == 'soak2h' && 150 || 55 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"label":"compact","topology":"compact","profile":"smoke"},{"label":"cluster","topology":"cluster","profile":"smoke"},{"label":"soak-compact","topology":"compact","profile":"soak"},{"label":"capacity-compact","topology":"compact","profile":"capacity"}]' || (inputs.topology == 'both' && format('[{{"label":"compact","topology":"compact","profile":"{0}"}},{{"label":"cluster","topology":"cluster","profile":"{0}"}}]', inputs.profile) || format('[{{"label":"{0}","topology":"{0}","profile":"{1}"}}]', inputs.topology || 'compact', inputs.profile || 'smoke'))) }}

    env:
      GOWORK: 'off'
      LOAD_PROFILE: ${{ matrix.profile }}
      LOAD_TOPOLOGY: ${{ matrix.topology }}
      LOAD_SCENARIO: ${{ inputs.scenario || 'all' }}
      MYSQL_PWD: runner-load-only
    steps:
      - name: Initialize local workspace
        run: echo "LOAD_DIR=$RUNNER_TEMP/middle-platform-load" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.0.0'
      - name: Validate scripts
        run: |
          bash -n tests/load/setup.sh
          bash -n tests/load/run.sh
          python3 -m py_compile tests/load/topology.py tests/load/report.py tests/load/db_report.py tests/load/process_monitor.py tests/load/capacity.py
          if [[ "$LOAD_PROFILE" == capacity ]]; then (cd shared && go test -tags loadtest ./bootstrap); fi
          test -z "$(gofmt -l tests/load/mock.go)"
          LOAD_SCENARIO=mixed k6 inspect tests/load/scenarios.js
      - name: Install local services
        run: |
          sudo apt-get update -q
          sudo apt-get install -y nginx supervisor sysstat
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'runner-load-only';"
      - name: Start isolated application stack
        run: bash tests/load/setup.sh
      - name: Run load scenarios
        if: matrix.profile != 'capacity'
        run: bash tests/load/run.sh
      - name: Explore 10000 QPS and profile services
        if: matrix.profile == 'capacity'
        run: python3 tests/load/capacity.py "$LOAD_DIR" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Explore all scenario saturation (PR only)
        if: github.event_name == 'pull_request' && matrix.profile == 'smoke'
        continue-on-error: true
        id: stress
        env:
          LOAD_PROFILE: stress
          LOAD_SCENARIO: all
        run: bash tests/load/run.sh
      - name: Collect diagnostics and report
        if: always()
        run: |
          mkdir -p "$LOAD_DIR/results"
          mysql -uroot -h127.0.0.1 -e "SHOW GLOBAL STATUS WHERE Variable_name IN ('Threads_connected','Threads_running','Max_used_connections','Slow_queries','Questions','Innodb_buffer_pool_reads','Innodb_row_lock_waits');" > "$LOAD_DIR/results/mysql-status.txt" 2>&1 || true
          if [[ "$LOAD_PROFILE" != capacity ]]; then python3 tests/load/report.py "$LOAD_DIR/results" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [[ '${{ steps.stress.outcome }}' == failure ]]; then
            echo 'Exploratory stress reached a threshold or execution error; see individual stage results.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop local services
        if: always()
        run: |
          if [ -f "$LOAD_DIR/supervisor.conf" ]; then
            supervisorctl -c "$LOAD_DIR/supervisor.conf" shutdown || true
          fi
          if [ -f "$LOAD_DIR/nginx.conf" ]; then
            nginx -p "$LOAD_DIR" -e "$LOAD_DIR/logs/nginx-error.log" -c "$LOAD_DIR/nginx.conf" -s quit || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        id: upload
        continue-on-error: true
        with:
          name: runner-load-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          path: |
            ${{ env.LOAD_DIR }}/results/
            ${{ env.LOAD_DIR }}/logs/
          retention-days: 1
          if-no-files-found: warn
      - name: Explain unavailable artifact
        if: always() && steps.upload.outcome == 'failure'
        run: |
          echo "::warning::Artifact upload failed; use the report and k6 output in job logs."
          echo "Artifact upload failed; use the report and k6 output in job logs." >> "$GITHUB_STEP_SUMMARY"
