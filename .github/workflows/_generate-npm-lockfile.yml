name: Generate npm lockfile (temporary)

on:
  push:
    branches:
      - ci/optimize-actions-phase1

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate dependencies
        working-directory: config-center-admin
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config-center-admin/package-lock.json
          git commit -m "build: lock frontend npm dependencies"
          git push origin HEAD:ci/optimize-actions-phase1
