name: One-shot LT26 read-only config check
on:
  push:
    branches: [test/lt26-config-readonly-preflight-20261117]
permissions: {}
jobs:
  readonly:
    if: github.repository == 'hctty27/middle-platform' && github.actor == 'hctty27' && github.ref == 'refs/heads/test/lt26-config-readonly-preflight-20261117'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Inspect three SDK configuration reads only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -cne 'DESKTOP-HA11EIT') { throw 'Unexpected runner.' }
          $apps=@(
            @{ app='lt26-app-000'; group='lt26-group-00' },
            @{ app='lt26-app-127'; group='lt26-group-15' },
            @{ app='lt26-app-255'; group='lt26-group-15' }
          )
          foreach ($entry in $apps) {
            $app=$entry.app
            $url='https://mp.skybluek.com/api/core/config/test/'+$app
            try {
              $response=Invoke-WebRequest -Uri $url -Method Get -UseBasicParsing -TimeoutSec 10 -MaximumRedirection 0
              $body=$response.Content | ConvertFrom-Json
              $valid=($response.StatusCode -eq 200 -and $body.code -eq 0 -and $body.data.snKey -ceq $app -and $body.data.zoneKey -ceq $entry.group)
              $status=if($valid){'PASS'}else{'MISMATCH'}
              Write-Host ('Read-only config: {0} {1} HTTP={2} businessCode={3}' -f $app,$status,$response.StatusCode,$body.code)
            } catch {
              $httpStatus='N/A'
              if ($_.Exception.Response) { $httpStatus=[int]$_.Exception.Response.StatusCode }
              Write-Host ('Read-only config: {0} FAILED HTTP={1}' -f $app,$httpStatus)
            }
          }
          Write-Host 'Done: three GET requests; no traffic test, checkout, secrets or writes.'
