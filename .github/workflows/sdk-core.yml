name: sdk-core

on:
  push:
    branches: [main]
    paths:
      - 'sdk-core/**'
      - 'shared/logging/**'
      - '.github/workflows/sdk-core.yml'
  pull_request:
    paths:
      - 'sdk-core/**'
      - 'shared/logging/**'
      - '.github/workflows/sdk-core.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sdk-core-test
          MYSQL_DATABASE: sdk_core_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -psdk-core-test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
    env:
      TEST_SDK_CORE_DB_DSN: root:sdk-core-test@tcp(127.0.0.1:3306)/sdk_core_test?parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk-core/go.mod
          cache-dependency-path: sdk-core/go.sum
      - name: Test and race check
        working-directory: sdk-core
        run: go test -race ./...
      - name: Vet and build
        working-directory: sdk-core
        run: |
          go vet ./...
          go build ./cmd/sdk-core
