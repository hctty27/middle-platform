name: sdk-core

on:
  push:
    branches: [main]
    paths:
      - 'sdk-core/**'
      - 'shared/logging/**'
      - '.github/workflows/sdk-core.yml'
  pull_request:
    paths:
      - 'sdk-core/**'
      - 'shared/logging/**'
      - '.github/workflows/sdk-core.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TEST_SDK_CORE_DB_DSN: root:sdk-core-test@tcp(127.0.0.1:3306)/sdk_core_test?parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@v4
      # SDK 集成测试直接使用 Runner 预装 MySQL。
      - name: 初始化本机 MySQL
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'sdk-core-test';"
          mysql -uroot -psdk-core-test -e "CREATE DATABASE sdk_core_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk-core/go.mod
          cache-dependency-path: sdk-core/go.sum
      - name: Test and race check
        working-directory: sdk-core
        run: go test -race ./...
      - name: Vet and build
        working-directory: sdk-core
        run: |
          go vet ./...
          go build ./cmd/sdk-core
