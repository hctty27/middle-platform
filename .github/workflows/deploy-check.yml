name: Deployment validation

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy-check.yml'
      - 'config-center/**'
      - 'config-center-access/**'
      - 'sdk-core/**'
      - 'config-center-admin/**'
      - 'shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy-check.yml'
      - 'config-center/**'
      - 'config-center-access/**'
      - 'sdk-core/**'
      - 'config-center-admin/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configs:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: sha-0000000000000000000000000000000000000000
      BIND_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and deployment script
        run: |
          docker compose -f deploy/compose.prod.yml config --quiet
          bash -n deploy/deploy.sh
      - name: Verify production service port map
        run: |
          docker compose --profile access -f deploy/compose.prod.yml config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/compose.json").read_text())
          services = data["services"]
          expected_ports = {
              "config-center": (8101, 8101),
              "config-center-access": (8090, 8090),
              "sdk-core-1": (8201, 8201),
              "sdk-core-2": (8202, 8202),
              "admin": (80, 80),
          }
          for name, (host_port, container_port) in expected_ports.items():
              service = services[name]
              assert len(service["ports"]) == 1, name
              assert int(service["ports"][0]["published"]) == host_port, name
              assert int(service["ports"][0]["target"]) == container_port, name
          assert len(set(p[0] for p in expected_ports.values())) == len(expected_ports)

          listen_variables = {
              "config-center": ("CONFIG_GO_ADDR", ":8101"),
              "config-center-access": ("CONFIG_ACCESS_ADDR", ":8090"),
              "sdk-core-1": ("SDK_CORE_ADDR", ":8201"),
              "sdk-core-2": ("SDK_CORE_ADDR", ":8202"),
          }
          for name, (key, address) in listen_variables.items():
              service = services[name]
              assert service["environment"][key] == address, name
              assert f"http://127.0.0.1:{address[1:]}/health/ready" in " ".join(
                  service["healthcheck"]["test"]
              ), name

          for name in ("sdk-core-1", "sdk-core-2"):
              service = services[name]
              assert service["image"] == services["sdk-core-1"]["image"], name
              assert service["volumes"] == services["sdk-core-1"]["volumes"], name

          gateway = Path("deploy/nginx/gateway.conf.example").read_text()
          for host in ("10.0.0.11", "10.0.0.12"):
              for port in (8201, 8202):
                  assert f"server {host}:{port} " in gateway
              assert f"server {host}:8101 " in gateway
              assert f"server {host}:80 " in gateway
          PY
      - name: Validate Nginx configuration
        run: |
          mkdir -p "$RUNNER_TEMP/nginx-certs"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=example.com' \
            -keyout "$RUNNER_TEMP/nginx-certs/privkey.pem" \
            -out "$RUNNER_TEMP/nginx-certs/fullchain.pem"
          docker run --rm \
            -v "$PWD/deploy/nginx/gateway.conf.example:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/nginx-certs:/etc/letsencrypt/live/example.com:ro" \
            nginx:stable-alpine nginx -t
          docker run --rm \
            -v "$PWD/deploy/nginx/admin-static.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-center
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=config-center
          - service: config-center-access
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=config-center-access
          - service: sdk-core
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=sdk-core
          - service: admin
            dockerfile: deploy/docker/admin.Dockerfile
            build_arg: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_arg }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
