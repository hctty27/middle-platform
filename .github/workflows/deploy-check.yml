name: Deployment validation

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy-check.yml'
      - 'config-center/**'
      - 'config-center-access/**'
      - 'sdk-core/**'
      - 'config-center-admin/**'
      - 'shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy-check.yml'
      - 'config-center/**'
      - 'config-center-access/**'
      - 'sdk-core/**'
      - 'config-center-admin/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configs:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: sha-0000000000000000000000000000000000000000
      BIND_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and deployment script
        run: |
          docker compose -f deploy/compose.prod.yml config --quiet
          bash -n deploy/deploy.sh
      - name: Verify dual SDK Core instances and port mapping
        run: |
          docker compose -f deploy/compose.prod.yml config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/compose.json").read_text())
          services = data["services"]
          for name, host_port in (("sdk-core-1", 8100), ("sdk-core-2", 8101)):
              service = services[name]
              assert any(int(port["published"]) == host_port and int(port["target"]) == 8082
                         for port in service["ports"]), name
              assert service["image"] == services["sdk-core-1"]["image"], name
              assert service["volumes"] == services["sdk-core-1"]["volumes"], name
          admin = services["admin"]
          assert any(int(port["published"]) == 8090 and int(port["target"]) == 80
                     for port in admin["ports"])
          gateway = Path("deploy/nginx/gateway.conf.example").read_text()
          for host in ("10.0.0.11", "10.0.0.12"):
              for port in (8100, 8101):
                  assert f"server {host}:{port} " in gateway
          for host in ("10.0.0.11", "10.0.0.12"):
              assert f"server {host}:8090 " in gateway
          PY
      - name: Validate Nginx configuration
        run: |
          mkdir -p "$RUNNER_TEMP/nginx-certs"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=example.com' \
            -keyout "$RUNNER_TEMP/nginx-certs/privkey.pem" \
            -out "$RUNNER_TEMP/nginx-certs/fullchain.pem"
          docker run --rm \
            -v "$PWD/deploy/nginx/gateway.conf.example:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/nginx-certs:/etc/letsencrypt/live/example.com:ro" \
            nginx:stable-alpine nginx -t
          docker run --rm \
            -v "$PWD/deploy/nginx/admin-static.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-center
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=config-center
          - service: config-center-access
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=config-center-access
          - service: sdk-core
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=sdk-core
          - service: admin
            dockerfile: deploy/docker/admin.Dockerfile
            build_arg: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_arg }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
