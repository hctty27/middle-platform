name: One-shot LT26 config 5k-20k QPS
on:
  push:
    branches: [test/lt26-config-qps-5000-20000-20261117]
permissions: {}
concurrency:
  group: lt26-config-high-qps-20261117
  cancel-in-progress: false
jobs:
  config-qps:
    if: github.repository == 'hctty27/middle-platform' && github.actor == 'hctty27' && github.ref == 'refs/heads/test/lt26-config-qps-5000-20000-20261117'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Execute bounded read-only GET QPS stages, fail closed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne 'DESKTOP-HA11EIT') { throw 'Unexpected runner, refusing load.' }
          $base = 'https://mp.skybluek.com'
          $paths = New-Object System.Collections.Generic.List[string]
          $cmd = Get-Command k6 -ErrorAction SilentlyContinue
          if ($cmd -and $cmd.CommandType -eq 'Application') { $paths.Add($cmd.Source) }
          foreach ($folder in @("$env:ProgramFiles/k6", "$env:ProgramFiles/Grafana Labs/k6",
                               "$env:LOCALAPPDATA/Microsoft/WinGet/Links", "$env:LOCALAPPDATA/Microsoft/WinGet/Packages")) {
            if (Test-Path -LiteralPath $folder -PathType Container) {
              Get-ChildItem -LiteralPath $folder -Recurse -File -Filter k6.exe -ErrorAction SilentlyContinue |
                ForEach-Object { $paths.Add($_.FullName) }
            }
          }
          foreach ($profile in @(Get-ChildItem -LiteralPath "$env:SystemDrive/Users" -Directory -ErrorAction SilentlyContinue)) {
            foreach ($suffix in @('AppData/Local/Microsoft/WinGet/Links','AppData/Local/Microsoft/WinGet/Packages')) {
              $folder = Join-Path $profile.FullName $suffix
              if (Test-Path -LiteralPath $folder -PathType Container) {
                Get-ChildItem -LiteralPath $folder -Recurse -File -Filter k6.exe -ErrorAction SilentlyContinue |
                  ForEach-Object { $paths.Add($_.FullName) }
              }
            }
          }
          $k6 = $null
          foreach ($exe in @($paths | Select-Object -Unique)) {
            if (Test-Path -LiteralPath $exe -PathType Leaf) {
              & $exe version
              if ($LASTEXITCODE -eq 0) { $k6 = $exe; break }
            }
          }
          if (-not $k6) { throw 'Installed k6 executable was not found.' }
          $response = Invoke-WebRequest -Uri ($base+'/api/core/config/test/lt26-app-000') -Method Get -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 10
          $body = $response.Content | ConvertFrom-Json
          if ($response.StatusCode -ne 200 -or $body.code -ne 0 -or $body.data.snKey -cne 'lt26-app-000') {
            throw 'Read-only readiness probe failed: no load traffic sent.'
          }
          Write-Host 'READINESS_PASS: only /api/core/config/test/{appid} GET endpoints will be exercised.'

          $script = @'
          import http from 'k6/http';
          import exec from 'k6/execution';
          import { Rate } from 'k6/metrics';

          const base = __ENV.BASE_URL;
          const qps = Number(__ENV.QPS);
          const seconds = Number(__ENV.SECONDS);
          const ids = Array.from({length:256},(_,i) => 'lt26-app-'+String(i).padStart(3,'0'));
          const failedBusiness = new Rate('business_failed');

          if (base !== 'https://mp.skybluek.com' || ![5000,10000,15000,20000].includes(qps) || seconds !== 10) {
            throw new Error('Refusing unapproved load target or schedule');
          }
          export const options = {
            scenarios: {
              config_read: {
                executor:'constant-arrival-rate',rate:qps,timeUnit:'1s',duration:'10s',
                preAllocatedVUs: Math.min(1000,Math.max(600,Math.ceil(qps*.05))),
                maxVUs: Math.min(1000,Math.max(600,Math.ceil(qps*.05))),
                gracefulStop:'3s',
              },
            },
            thresholds: {
              http_req_failed:[{threshold:'rate<0.000001',abortOnFail:true,delayAbortEval:'2s'}],
              business_failed:[{threshold:'rate<0.000001',abortOnFail:true,delayAbortEval:'2s'}],
              dropped_iterations:[{threshold:'count<1',abortOnFail:true,delayAbortEval:'2s'}],
              http_req_duration:[
                {threshold:'p(95)<100',abortOnFail:true,delayAbortEval:'3s'},
                {threshold:'p(99)<300',abortOnFail:true,delayAbortEval:'3s'},
              ],
              http_reqs:['count>='+Math.floor(qps*seconds*.999)],
            },
            maxRedirects:0,
            summaryTrendStats:['avg','med','max','p(95)','p(99)'],
          };

          export default function () {
            const app=ids[exec.scenario.iterationInTest%ids.length];
            const res=http.get(base+'/api/core/config/test/'+app, {timeout:'3s',tags:{name:'sdk-config'}});
            let ok=false;
            try {
              const j=res.json();
              ok=res.status===200&&j.code===0&&j.data&&j.data.snKey===app;
            } catch (_) {}
            failedBusiness.add(!ok);
          }
          '@

          $work = Join-Path $env:TEMP ('lt26-high-qps-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $scriptPath=Join-Path $work 'config-qps.js'
          Set-Content -LiteralPath $scriptPath -Value $script -Encoding UTF8
          $env:BASE_URL=$base
          $env:SECONDS='10'
          try {
            foreach ($rate in @(5000,10000,15000,20000)) {
              $freeMB=(Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1024
              Write-Host ('WINDOWS_PREFLIGHT target={0} free_memory_mb={1}' -f $rate,[math]::Round($freeMB))
              if ($freeMB -lt 2048) { throw 'Insufficient load-generator free memory; stopped.' }
              $env:QPS=[string]$rate
              $summary=Join-Path $work ('summary-'+$rate+'.json')
              Write-Host ('START target={0} QPS duration=10s GET-only channels=256' -f $rate)
              & $k6 run --summary-export $summary $scriptPath
              $exitCode=$LASTEXITCODE
              if ($exitCode -ne 0) {
                Write-Host ('STOP target={0} QPS k6_exit={1}; no higher stage.' -f $rate,$exitCode)
                exit $exitCode
              }
              if (-not (Test-Path -LiteralPath $summary -PathType Leaf)) {
                throw ('Missing k6 summary for {0} QPS.' -f $rate)
              }
              Write-Host ('PASS stage={0} QPS: zero errors, zero drops and thresholds met.' -f $rate)
              Start-Sleep -Seconds 10
            }
            Write-Host 'PASS all stages 5000/10000/15000/20000 target QPS; this is not long-duration capacity certification.'
          } finally {
            Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item Env:BASE_URL -ErrorAction SilentlyContinue
            Remove-Item Env:QPS -ErrorAction SilentlyContinue
            Remove-Item Env:SECONDS -ErrorAction SilentlyContinue
          }
