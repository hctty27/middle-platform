name: Runner Endpoint QPS Ladder

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Endpoints: quick, read, write or all (loopback only)'
        type: choice
        options: [quick, read, write, all]
        default: all
      tiers:
        description: 'basic: bounded, high: exploratory 100-20000 read QPS'
        type: choice
        options: [basic, high]
        default: basic
      topology:
        description: 'Application topology inside this hosted Runner'
        type: choice
        options: [compact, cluster]
        default: compact
      seconds:
        description: 'Seconds per QPS tier (3-15)'
        type: number
        default: 5
      endpoint:
        description: 'Optional exact endpoint ID from endpoint-qps-catalog.json'
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/endpoint-qps.yml'
      - 'tests/load/endpoint-qps*'
      - 'tests/load/setup-access.sh'

permissions:
  contents: read

concurrency:
  group: endpoint-qps-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qps:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOWORK: 'off'
      LOAD_PROFILE: endpoint-qps
      LOAD_TOPOLOGY: ${{ github.event_name == 'pull_request' && 'compact' || inputs.topology }}
      ENDPOINT_GROUP: ${{ github.event_name == 'pull_request' && 'all' || inputs.group }}
      ENDPOINT_TIERS: ${{ github.event_name == 'pull_request' && 'basic' || inputs.tiers }}
      ENDPOINT_SECONDS: ${{ github.event_name == 'pull_request' && '3' || inputs.seconds }}
      ENDPOINT_CASE: ${{ github.event_name == 'pull_request' && '' || inputs.endpoint }}
      MYSQL_PWD: runner-load-only
      LOAD_DIR: ${{ runner.temp }}/middle-platform-endpoint-qps
    steps:
      - name: Confirm disposable GitHub-hosted Runner
        shell: bash
        run: |
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$LOAD_DIR" == "$RUNNER_TEMP/"* ]]
          mkdir -p "$LOAD_DIR/results" "$LOAD_DIR/logs"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk-core/go.mod
          cache: true
          cache-dependency-path: |
            **/go.sum
      - uses: grafana/setup-k6-action@v1
      - name: Validate QPS scripts and route catalog
        shell: bash
        run: |
          bash -n tests/load/setup.sh tests/load/setup-access.sh
          python3 -m py_compile tests/load/endpoint-qps.py tests/load/test_endpoint_qps.py
          python3 -m unittest discover -s tests/load -p 'test_*.py'
          QPS_CASE=core-config k6 inspect tests/load/endpoint-qps.js > /dev/null
      - name: Install temporary local database and process manager
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y nginx supervisor sysstat
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'runner-load-only';"
      - name: Start temporary configuration center, SDK and mock
        run: bash tests/load/setup.sh
      - name: Start isolated config-center-access replica
        run: bash tests/load/setup-access.sh
      - name: Run independently paced endpoint ladders
        shell: bash
        run: |
          set -o pipefail
          python3 -u tests/load/endpoint-qps.py "$LOAD_DIR" | tee "$LOAD_DIR/results/endpoint-qps-summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect test environment diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOAD_DIR/results"
          mysql -uroot -h127.0.0.1 -e \
            "SHOW GLOBAL STATUS WHERE Variable_name IN ('Threads_connected','Threads_running','Max_used_connections','Innodb_row_lock_waits');" \
            > "$LOAD_DIR/results/mysql-status.txt" 2>&1 || true
      - name: Stop disposable applications and gateway
        if: always()
        shell: bash
        run: |
          if [ -f "$LOAD_DIR/supervisor.conf" ]; then
            supervisorctl -c "$LOAD_DIR/supervisor.conf" shutdown || true
          fi
          if [ -f "$LOAD_DIR/nginx.conf" ]; then
            nginx -p "$LOAD_DIR" -e "$LOAD_DIR/logs/nginx-error.log" -c "$LOAD_DIR/nginx.conf" -s quit || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: endpoint-qps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.LOAD_DIR }}/results/
            ${{ env.LOAD_DIR }}/logs/
          retention-days: 3
          if-no-files-found: warn
