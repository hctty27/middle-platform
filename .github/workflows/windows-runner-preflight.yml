name: Windows self-hosted runner preflight (one-shot)
# Temporary, trusted-branch-only check. Never runs on PRs or on a schedule.
on:
  push:
    branches: [test/windows-runner-preflight-20261117]

permissions: {}
concurrency:
  group: windows-preflight-20261117
  cancel-in-progress: false

jobs:
  inspect:
    name: Verify trusted Windows runner and installed k6
    if: github.repository == 'hctty27/middle-platform' && github.ref == 'refs/heads/test/windows-runner-preflight-20261117' && github.actor == 'hctty27'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Verify runner identity and k6 without checking out repository code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne 'DESKTOP-HA11EIT') {
            throw "Unexpected runner name. Refusing to execute."
          }
          Write-Host 'Runner identity: DESKTOP-HA11EIT'
          Write-Host ('Operating system: ' + $env:RUNNER_OS)
          Write-Host ('Architecture: ' + $env:RUNNER_ARCH)
          # Probe trusted installation directories without dumping the runner's PATH,
          # user names, private files or any environment secrets into public logs.
          $command = Get-Command k6 -ErrorAction SilentlyContinue
          $candidates = New-Object System.Collections.Generic.List[string]
          if ($command -and $command.CommandType -eq 'Application') { $candidates.Add($command.Source) }
          foreach ($directory in @(
            "$env:ProgramFiles\k6",
            "$env:ProgramFiles\Grafana Labs\k6",
            "$env:ProgramFiles\Grafana\k6",
            "$env:LOCALAPPDATA\Microsoft\WinGet\Links",
            "$env:LOCALAPPDATA\Microsoft\WinGet\Packages"
          )) {
            if (Test-Path -LiteralPath $directory -PathType Container) {
              Get-ChildItem -LiteralPath $directory -Filter 'k6.exe' -File -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object { $candidates.Add($_.FullName) }
            }
          }
          $usersRoot = Join-Path $env:SystemDrive 'Users'
          if (Test-Path -LiteralPath $usersRoot -PathType Container) {
            foreach ($profile in @(Get-ChildItem -LiteralPath $usersRoot -Directory -ErrorAction SilentlyContinue)) {
              foreach ($directory in @(
                (Join-Path $profile.FullName 'AppData\Local\Microsoft\WinGet\Links'),
                (Join-Path $profile.FullName 'AppData\Local\Microsoft\WinGet\Packages')
              )) {
                if (Test-Path -LiteralPath $directory -PathType Container) {
                  Get-ChildItem -LiteralPath $directory -Filter 'k6.exe' -File -Recurse -ErrorAction SilentlyContinue |
                    ForEach-Object { $candidates.Add($_.FullName) }
                }
              }
            }
          }
          $passed = $false
          foreach ($exe in @($candidates | Select-Object -Unique)) {
            if (Test-Path -LiteralPath $exe -PathType Leaf) {
              & $exe version
              if ($LASTEXITCODE -eq 0) {
                Write-Host 'PASS: installed k6 was found and works on the runner. No load traffic sent.'
                $passed = $true
                break
              }
            }
          }
          if (-not $passed) {
            throw 'k6 not found in runner PATH or common trusted WinGet/MSI locations. Restart the runner after installation or install k6 system-wide.'
          }
