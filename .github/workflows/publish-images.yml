name: Publish production images

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify-sdk-and-compose:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: sha-0000000000000000000000000000000000000000
      BIND_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: sdk-core/go.sum
      - name: Verify SDK core
        working-directory: sdk-core
        run: |
          go test -race ./...
          go vet ./...
      - name: Validate production Compose
        run: docker compose -f deploy/compose.prod.yml config --quiet

  publish:
    needs: verify-sdk-and-compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-center
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=config-center
          - service: config-center-access
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=config-center-access
          - service: sdk-core
            dockerfile: deploy/docker/go.Dockerfile
            build_arg: SERVICE=sdk-core
          - service: admin
            dockerfile: deploy/docker/admin.Dockerfile
            build_arg: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_arg }}
          push: true
          tags: ghcr.io/hctty27/middle-platform-${{ matrix.service }}:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
