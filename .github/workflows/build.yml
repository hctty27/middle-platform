name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go config center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: config-center
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test-only
          MYSQL_DATABASE: config_center_go_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pintegration-test-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
    env:
      TEST_CONFIG_DB_DSN: root:integration-test-only@tcp(127.0.0.1:3306)/config_center_go_test?parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center/go.mod
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Validate sqlc generated code
        run: |
          curl -fsSL --retry 3 -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sqlc.tar.gz -C /tmp sqlc
          /tmp/sqlc generate
          test -z "$(git status --porcelain -- internal/sqlcgen)"
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/config-center ./cmd/migrate

  access:
    name: Go access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: config-center-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center-access/go.mod
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/config-center-access

  admin:
    name: Vue admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: config-center-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: config-center-admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  integration:
    name: Go MySQL migration + two instances + Webhook E2E
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test
          MYSQL_DATABASE: config_center
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pintegration-test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
    env:
      ACCESS_DB_DSN: root:integration-test@tcp(127.0.0.1:3306)/config_access?parseTime=true&loc=UTC
      CONFIG_CENTER_URL: http://127.0.0.1:8080
      CONFIG_WEBHOOK_SECRET: ci-signed-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center/go.mod
      - name: Prepare access database
        run: |
          docker exec "$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)" mysql -uroot -pintegration-test -e "CREATE DATABASE config_access CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
      - name: Build Go services and migration CLI
        run: |
          (cd config-center && go build -o /tmp/config-center-ci ./cmd/config-center)
          (cd config-center && go build -o /tmp/config-center-migrate-ci ./cmd/migrate)
          (cd config-center-access && go build -o /tmp/config-center-access-ci ./cmd/config-center-access)
      - name: Test real V1-V4 schema upgrades
        run: python3 scripts/ci_migration_smoke.py
      - name: Test Go cluster and signed callbacks
        run: python3 scripts/ci_smoke.py

  ci-gate:
    name: CI Gate
    needs: [go, access, admin, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" != "success,success,success,success" ]]; then
            echo "::error::One or more checks failed or were skipped: $RESULTS"
            exit 1
          fi
