name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go 静态检查、人工 SQL 及集群端到端回归均在非容器环境执行。
  go:
    name: Go config center
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: config-center
    env:
      TEST_CONFIG_DB_DSN: root:integration-test-only@tcp(127.0.0.1:3306)/config_center_go_test?parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@v4
      # 在 Runner 原生 MySQL 上执行数据访问回归，避免依赖容器服务。
      - name: 初始化本机 MySQL
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'integration-test-only';"
          mysql -uroot -pintegration-test-only -e "CREATE DATABASE config_center_go_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center/go.mod
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Validate sqlc generated code
        run: |
          curl -fsSL --retry 3 -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sqlc.tar.gz -C /tmp sqlc
          /tmp/sqlc generate
          git diff --exit-code -- internal/sqlcgen
      - name: Verify shared logging module
        run: (cd ../shared/logging && go test -race -count=1 ./... && go vet ./...)
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/config-center

  access:
    name: Go access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: config-center-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center-access/go.mod
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/config-center-access

  admin:
    name: Vue admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: config-center-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: config-center-admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  integration:
    name: Go MySQL manual SQL + two instances + Webhook E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ACCESS_DB_DSN: root:integration-test@tcp(127.0.0.1:3306)/config_access?parseTime=true&loc=UTC
      CONFIG_CENTER_URL: http://127.0.0.1:8080
      CONFIG_WEBHOOK_SECRET: ci-signed-webhook-secret
    steps:
      - uses: actions/checkout@v4
      # SQL 回归用例会开启 GTID；确保运行实例启用了二进制日志。
      - name: 初始化本机 MySQL 与二进制日志
        run: |
          sudo tee /etc/mysql/mysql.conf.d/99-middle-platform-ci.cnf >/dev/null <<'EOF'
          [mysqld]
          server-id=1
          log_bin=mysql-bin
          binlog_format=ROW
          EOF
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'integration-test';"
          mysql -uroot -pintegration-test -e "CREATE DATABASE config_center CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE DATABASE config_access CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: config-center/go.mod
      - name: Build Go services
        run: |
          (cd config-center && go build -o /tmp/config-center-ci ./cmd/config-center)
          (cd config-center-access && go build -o /tmp/config-center-access-ci ./cmd/config-center-access)
      - name: Test manual SQL and database safety
        run: python3 scripts/ci_schema_sql_smoke.py
      - name: Initialize authoritative and replica schemas with SQL
        env:
          MYSQL_PWD: integration-test
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot config_center < config-center/db/sql/initialize.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot config_access < config-center-access/db/sql/initialize.sql
      - name: Test Go cluster and signed callbacks
        run: python3 scripts/ci_smoke.py

  ci-gate:
    name: CI Gate
    needs: [go, access, admin, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" != "success,success,success,success" ]]; then
            echo "::error::One or more checks failed or were skipped: $RESULTS"
            exit 1
          fi
