server:
  port: ${CONFIG_CENTER_PORT:8080}
spring:
  application:
    name: config-center-server
  datasource:
    url: ${CONFIG_DB_URL:jdbc:mysql://localhost:3306/config_center?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${CONFIG_DB_USER:root}
    password: ${CONFIG_DB_PASSWORD:}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
config:
  webhook:
    poll-delay-ms: 3000
    request-timeout-seconds: 5
