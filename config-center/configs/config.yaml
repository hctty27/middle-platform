# 配置中心：复制为 config-dev.yaml 或 config-prod.yaml 后填写实际配置。
server:
  address: "127.0.0.1:8080"

# 权威 MySQL 库；首次部署先运行 cmd/migrate（当前 V12）。
database:
  dsn: ""

# 管理与同步接口无内建鉴权，公网入口须通过网关或内网 ACL 保护。
# 仅允许向白名单中的主机发送 Webhook，新增订阅者无需重启服务。
webhook:
  allowedHosts:
    - localhost
    - 127.0.0.1

log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
