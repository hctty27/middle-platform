# 配置中心：复制为 config-dev.yaml 或 config-prod.yaml 后填写实际配置。
server:
  address: "127.0.0.1:8080"

# 权威 MySQL 库；首次部署需先手动执行 db/sql/initialize.sql。
database:
  dsn: ""

# 仅管理接口使用此密钥签名；生产使用至少 32 字节随机密钥，不要提交真实密钥。
adminAuth:
  secret: ""

# 未配置或过短时，管理接口拒绝请求；同步和业务接口不受影响。
log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
