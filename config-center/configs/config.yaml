# 配置中心：完整配置模板。复制为 config-dev.yaml 或 config-prod.yaml 后独立填写；不继承 config.yaml。
server:
  address: "127.0.0.1:8080"

# 权威 MySQL 库；首次部署空库需先手动执行 db/full/config_center.sql。
database:
  dsn: ""

# 仅管理接口使用此密钥签名；生产使用至少 32 字节随机密钥，不要提交真实密钥。
adminAuth:
  secret: ""

# 管理接口始终验签；密钥未配置或短于 32 字节时管理请求一律拒绝。
log:
  level: info
  format: json
  output: stdout
  accessEnabled: true
  slowThreshold: 500ms
