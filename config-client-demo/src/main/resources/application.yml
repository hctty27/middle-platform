server:
  port: ${CONFIG_CLIENT_PORT:8081}
spring:
  application:
    name: config-client-demo
  datasource:
    url: ${DEMO_DB_URL:jdbc:mysql://localhost:3306/config_demo?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DEMO_DB_USER:root}
    password: ${DEMO_DB_PASSWORD:}
# 启用 Starter 后，通过回调和定期校对维护本地数据库副本。
config:
  client:
    enabled: true
    base-url: ${CONFIG_CENTER_URL:http://localhost:8080}
    webhook-secret: ${CONFIG_WEBHOOK_SECRET:change-me-in-development}
    connect-timeout-ms: ${CONFIG_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CONFIG_CLIENT_READ_TIMEOUT_MS:15000}
    reconcile-ms: 300000
