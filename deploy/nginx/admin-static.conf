 # 管理端静态站点：仅用于内网监听，外部访问统一走受保护的网关。
server {
    listen 8281;
    server_name _;
    root /opt/middle-platform/admin;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 管理接口必须经外部网关转发；不能将 /api/ 路径错误回退到 Vue SPA。
    location ^~ /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
