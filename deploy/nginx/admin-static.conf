server {
    listen 8281;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The external admin gateway handles /api/config/; never fallback to SPA for API.
    location ^~ /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
