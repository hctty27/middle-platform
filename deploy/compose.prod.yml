name: middle-platform

x-go-common: &go-common
  restart: unless-stopped
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  config-center:
    <<: *go-common
    image: ghcr.io/hctty27/middle-platform-config-center:${IMAGE_TAG:?Set IMAGE_TAG to sha-<commit>}
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8080:8080"
    volumes:
      - "${CONFIG_DIR:-/etc/middle-platform}/config-center.yaml:/app/config.yaml:ro"
    command: ["-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  sdk-core:
    <<: *go-common
    image: ghcr.io/hctty27/middle-platform-sdk-core:${IMAGE_TAG:?Set IMAGE_TAG to sha-<commit>}
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8082:8082"
    volumes:
      - "${CONFIG_DIR:-/etc/middle-platform}/sdk-core.yaml:/app/config.yaml:ro"
    command: ["-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  admin:
    restart: unless-stopped
    image: ghcr.io/hctty27/middle-platform-admin:${IMAGE_TAG:?Set IMAGE_TAG to sha-<commit>}
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8083:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Optional independent access replica. Use --profile access only on an access host.
  config-center-access:
    <<: *go-common
    profiles: ["access"]
    image: ghcr.io/hctty27/middle-platform-config-center-access:${IMAGE_TAG:?Set IMAGE_TAG to sha-<commit>}
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8081:8081"
    volumes:
      - "${CONFIG_DIR:-/etc/middle-platform}/config-center-access.yaml:/app/config.yaml:ro"
    command: ["-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
