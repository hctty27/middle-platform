name: middle-platform

x-go-common: &go-common
  restart: unless-stopped
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  config-center:
    <<: *go-common
    image: ghcr.io/hctty27/middle-platform-config-center:${IMAGE_TAG:?Set IMAGE_TAG to sha-<commit>}
    environment:
      CONFIG_GO_ADDR: ":8201"
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8201:8201"
    volumes:
      - "${CONFIG_DIR:-/etc/middle-platform}/config-center.yaml:/app/config.yaml:ro"
    command: ["-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8201/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  # Two separate Go processes share the same read-only config and database pool settings.
  sdk-core-1: &sdk-core-service
    <<: *go-common
    image: ghcr.io/hctty27/middle-platform-sdk-core:${IMAGE_TAG:?Set IMAGE_TAG to sha-<commit>}
    environment:
      SDK_CORE_ADDR: ":8211"
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8211:8211"
    volumes:
      - "${CONFIG_DIR:-/etc/middle-platform}/sdk-core.yaml:/app/config.yaml:ro"
    command: ["-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8211/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  sdk-core-2:
    <<: *sdk-core-service
    environment:
      SDK_CORE_ADDR: ":8212"
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8212:8212"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8212/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

  admin:
    restart: unless-stopped
    image: ghcr.io/hctty27/middle-platform-admin:${IMAGE_TAG:?Set IMAGE_TAG to sha-<commit>}
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8281:8281"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8281/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Optional independent access replica. Use --profile access only on an access host.
  config-center-access:
    <<: *go-common
    profiles: ["access"]
    image: ghcr.io/hctty27/middle-platform-config-center-access:${IMAGE_TAG:?Set IMAGE_TAG to sha-<commit>}
    environment:
      CONFIG_ACCESS_ADDR: ":8291"
    ports:
      - "${BIND_IP:?Set BIND_IP to the private host IP}:8291:8291"
    volumes:
      - "${CONFIG_DIR:-/etc/middle-platform}/config-center-access.yaml:/app/config.yaml:ro"
    command: ["-config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8291/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
